version: '3.8'

services:
  # 1. Servidor Web (Reverse Proxy)
  nginx:
    image: nginx:alpine
    container_name: dentaia-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - nextjs
      - minio
    networks:
      - dentaia-network

  # 2. Aplicació Principal (Frontend + Backend)
  nextjs:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dentaia-nextjs
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      - MINIO_ENDPOINT=minio
      - MINIO_PORT=9000
      - MINIO_USE_SSL=false
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD}
      - AUTH_SECRET=${AUTH_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - dentaia-network

  # 3. Base de Dades (PostgreSQL)
  postgres:
    image: postgres:16-alpine
    container_name: dentaia-postgres
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432" # Només exposat per accedir-hi ràpid i debugar amb Prisma Studio
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - dentaia-network

  # 4. Emmagatzematge de Fitxers (Consola MinIO s3)
  minio:
    image: minio/minio
    container_name: dentaia-minio
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000" # API Storage
      - "9001:9001" # Consola Administrador
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - dentaia-network

networks:
  dentaia-network:
    driver: bridge

volumes:
  postgres_data:
  minio_data: